<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WriteWise</title><link rel="stylesheet" href="shared.css"><link rel="stylesheet" href="popup.css"></head><body><main><div class="brand"><img src="icons/icon-128.png" alt="">WriteWise</div><h1>写得更好，<br>还是你的声音。</h1><p class="muted tiny">语法、清晰度、语气。<br>用你自己的 AI，照顾每一次表达。</p><p id="connection" class="notice">读取设置中…</p><div class="buttons"><button class="primary" id="open">打开网页写作助手</button><button id="studio">独立写作台 · 草稿 / 大纲 / 改写</button><button id="options">API 与偏好设置</button></div><hr><div class="checkline"><input type="checkbox" id="pause"><label for="pause" class="tiny">暂停当前网站</label></div><p id="site" class="tiny muted"></p><p id="status" class="status" role="status"></p><p class="tiny muted">快捷检查：⌥ / Alt + Shift + W<br>选中文字 → 右键 → WriteWise</p></main><script type="module" src="popup.js"></script></body></html>
