<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WriteWise · 写作台</title><link rel="stylesheet" href="shared.css"><link rel="stylesheet" href="studio.css"></head>
<body><main><header><div class="brand"><img src="icons/icon-128.png" alt="">WriteWise <span class="muted">/ 写作台</span></div><a href="options.html">API 设置 ↗</a></header><div class="intro"><span class="badge">A SPACE FOR YOUR NEXT GOOD IDEA</span><h1>从一个想法，<br>到一句恰好的表达。</h1><p class="muted">写下来，理清楚，再让它更好一点。</p></div>
<section class="workspace"><div class="card"><div class="row"><h2>你的文字或写作要求</h2><span id="count" class="tiny muted">0 / 16,000</span></div><textarea id="source" rows="13" maxlength="16000" placeholder="粘贴要修改的段落，或写下草稿需求。" aria-label="待处理文字" spellcheck="false"></textarea>
<div class="row"><div class="field"><label for="action">想做什么？</label><select id="action"><option value="check">检查语法 / 拼写</option><option value="rewrite">改写与润色</option><option value="concise">精简表达</option><option value="tone">调整语气</option><option value="translate">翻译</option><option value="draft">生成草稿</option><option value="outline">生成大纲</option><option value="brainstorm">头脑风暴</option></select></div></div>
<label for="instruction">补充要求（可选）</label><textarea id="instruction" rows="2" maxlength="2000" placeholder="读者是谁？希望多长？有哪些重点？"></textarea><div class="row bottom"><button id="run" class="primary">开始写作 →</button><button id="clear">清空</button></div><p class="tiny muted">⌘ / Ctrl + Enter 开始。本页不持久保存草稿，关闭后清除。</p></div>
<div class="card output"><div class="row"><h2>更好的表达</h2><button id="copy" class="link" disabled>复制</button></div><p id="status" class="status" role="status" aria-live="polite">你的文字会直接发送给已配置的 API 服务商。</p><div id="result" class="result placeholder">每个好句子，<br>都从你的声音开始。</div><div id="issues"></div><button id="continue" class="hidden">用此结果继续编辑</button></div></section><footer>常规输入框可直接使用网页内 W 按钮。Google Docs 画布编辑器等特殊页面，可复制到这里处理。</footer></main><script src="model-picker.js"></script><script type="module" src="studio.js"></script></body></html>
